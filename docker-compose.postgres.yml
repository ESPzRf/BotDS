services:
  db:
    image: postgres:16-alpine
    container_name: discord-mod-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: modbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: modbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modbot -d modbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      args:
        WITH_POSTGRES: "1"
    container_name: discord-mod-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://modbot:${POSTGRES_PASSWORD:-change_me}@db:5432/modbot
      LOG_FILE: /app/logs/bot.log
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
